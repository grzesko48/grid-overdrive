dcrumb","categoryId":"CAT_PL_MM_31050","name":"Monitory dla graczy"}],"ean":"4711636032605","manufacturer":"ASUS","manufacturerId":"417","url":"/pl/product/_monitor-asus-rog-strix-xg27aqdpg-265-wqhd-oled-003ms-500hz-amd-freesync-premium-pro-g-sync-czarny-1501523.html","vat":{"__typename":"GraphqlVat","rate":0.23},"variants":[],"additionalInformation":null,"retailRestrictions":[],"tax":23,"productGroupId":4249,"description":"<p><h3>Monitor ASUS ROG Strix XG27AQDPG 26,5 WQHD OLED 0.03ms 500Hz AMD FreeSync Premium Pro G-Sync Czarny</h3></p>\n<p>ASUS ROG Strix XG27AQDPG to ultranowoczesny monitor gamingowy z matrycą QD‑OLED, który oferuje ekstremalną płynność obrazu dzięki odświeżaniu 500 Hz i czasowi reakcji 0,03 ms. Zaprojektowany dla graczy e‑sportowych, zapewnia perfekcyjną jakość obrazu, głęboką czerń i błyskawiczną responsywność.</p>\n<p> </p>\n<p> </p>\n<p><h3>Najważniejsze korzyści:</h3></p>\n<p>- Panel QD‑OLED 26,5\" WQHD – wyjątkowa ostrość, głębia kolorów i perfekcyjny kontrast</p>\n<p>- Częstotliwość odświeżania 500 Hz – absolutnie płynny obraz w dynamicznych grach</p>\n<p>- Czas reakcji 0,03 ms GTG – natychmiastowa reakcja matrycy bez smużenia</p>\n<p>- HDR10 z jasnością szczytową 1000 cd/m² – realistyczne efekty świetlne</p>\n<p>- FreeSync Premium Pro i G‑SYNC Compatible – płynna synchronizacja obrazu bez tearingu</p>\n<p>- AI Visual, Dynamic Crosshair i Dynamic Shadow Boost – inteligentne wspomaganie rozgrywki</p>\n<p>- Aura Sync i Neo Proximity Sensor – efektowne podświetlenie i automatyczne oszczędzanie energii</p>\n<p>- Ergonomiczna konstrukcja z pivotem – pełna regulacja i montaż VESA 100×100 mm.</p>\n<p> </p>\n<p><h3>Funkcjonalność i wygoda</h3></p>\n<p>Monitor oferuje bogaty zestaw funkcji gamingowych, takich jak GamePlus, Game Visual, Extreme Low Motion Blur oraz GameFast Input. Porty HDMI 2.1, DisplayPort 1.4 DSC, USB Hub (2× USB‑A) i wyjście audio zapewniają pełną kompatybilność z komputerami i konsolami. Dzięki technologii ASUS OLED Care panel jest chroniony przed wypaleniami.</p>\n<p> </p>\n<p><h3>Design i montaż</h3></p>\n<p>Smukła konstrukcja z charakterystycznym wzornictwem ROG, podświetleniem Aura Sync i pełną ergonomią (tilt, swivel, pivot, regulacja wysokości) pozwala dopasować monitor do każdego stanowiska gamingowego. Model waży 6,6 kg z podstawką, co ułatwia montaż i ustawienie.</p>\n<p> </p>\n<p><h3>Dla kogo ASUS ROG Strix XG27AQDPG?</h3></p>\n<p>To idealny wybór dla graczy e‑sportowych i entuzjastów, którzy oczekują maksymalnej płynności, perfekcyjnej jakości obrazu i zaawansowanych funkcji wspomagających rozgrywkę, a jednocześnie chcą korzystać z zalet panelu QD‑OLED.</p>","descriptionMarketing":null,"accessoriesRelated":[{"__typename":"GraphqlRelatedProduct","productId":"1488849"},{"__typename":"GraphqlRelatedProduct","productId":"1502447"},{"__typename":"GraphqlRelatedProduct","productId":"1502448"},{"__typename":"GraphqlRelatedProduct","productId":"1442718"},{"__typename":"GraphqlRelatedProduct","productId":"1483118"},{"__typename":"GraphqlRelatedProduct","productId":"1488859"},{"__typename":"GraphqlRelatedProduct","productId":"1488862"},{"__typename":"GraphqlRelatedProduct","productId":"1426609"},{"__typename":"GraphqlRelatedProduct","productId":"1427598"},{"__typename":"GraphqlRelatedProduct","productId":"1449797"},{"__typename":"GraphqlRelatedProduct","productId":"1471577"},{"__typename":"GraphqlRelatedProduct","productId":"1300375"},{"__typename":"GraphqlRelatedProduct","productId":"1491678"},{"__typename":"GraphqlRelatedProduct","productId":"1487507"},{"__typename":"GraphqlRelatedProduct","productId":"1493135"}],"hasDataEraseCode":false,"predecessorProductIds":[],"predecessor":null,"successorProductIds":[],"successor":null,"assetSafetyInformationDocuments":[{"__typename":"GraphqlProductAsset","link":"https://assets.mmsrg.com/ada/166325/c1/-/-/ASSET_MMS_165172055","pixelboxxId":"ASSET_MMS_165172055","altText":"Czarno-biały dokument z instrukcjami bezpieczeństwa dla monitorów komputerowy

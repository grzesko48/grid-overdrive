ductGroupId":4251,"description":"<p><h3>Monitor SAMSUNG Odyssey OLED G7 LS32HG730SUXEN 32 UHD 4K OLED 0.3ms 330Hz FreeSync Premium Pro G-Sync Czarny</h3></p>\n<p>Monitor Samsung Odyssey OLED G7 32\" (G73SH) to ekran gamingowy 4K z matrycą OLED, odświeżaniem do 330 Hz oraz czasem reakcji 0.03 ms. Model oferuje funkcję Dual Mode (4K 165 Hz / FHD 330 Hz), certyfikat VESA DisplayHDR True Black 400, Pantone Validated oraz obsługę FreeSync Premium Pro i G‑Sync Compatible. Dzięki pełnej regulacji podstawy, szerokiej palecie barw i natychmiastowej reakcji pikseli monitor sprawdzi się w grach e‑sportowych, RPG, FPS oraz w zastosowaniach wymagających wysokiej jakości obrazu.</p>\n<p> </p>\n<p><h3>Co zyskujesz, wybierając Odyssey OLED G7 LS32HG730SUXEN:</h3></p>\n<p>- <strong>Matryca OLED 4K:</strong> wysoka szczegółowość – głęboka czerń i precyzyjne odwzorowanie barw</p>\n<p>- <strong>VESA DisplayHDR True Black 400:</strong> wysoki kontrast – widoczne detale w ciemnych scenach</p>\n<p>- <strong>Dual Mode:</strong> 4K 165 Hz lub FHD 330 Hz – dopasowanie parametrów do rodzaju gry</p>\n<p>- <strong>Czas reakcji 0.03 ms:</strong> natychmiastowa zmiana pikseli – redukcja smużenia i ghostingu</p>\n<p>- <strong>FreeSync Premium Pro i G‑Sync Compatible:</strong> stabilny obraz – brak zacięć i rozrywania klatek</p>\n<p>- <strong>Pantone Validated:</strong> zgodność kolorystyczna – ponad 2100 barw Pantone i 110 odcieni SkinTone</p>\n<p>- <strong>Ergonomiczna podstawa HAS Pivot:</strong> regulacja wysokości, pochylenia, obrotu i pivot.</p>\n<p> </p>\n<p><h3>OLED 4K – wysoka szczegółowość i głęboka czerń</h3></p>\n<p>Matryca OLED zapewnia wyraźny, ostry obraz w rozdzielczości 4K (3840×2160). Dzięki natychmiastowej reakcji pikseli i wysokiemu kontrastowi monitor oferuje realistyczne odwzorowanie scen, szczególnie w grach z rozbudowanymi światami i efektami świetlnymi.</p>\n<p> </p>\n<p><h3>VESA DisplayHDR True Black 400</h3></p>\n<p>Technologia True Black 400 umożliwia wyświetlanie prawdziwej czerni bez efektu rozlewania światła. Kontrast 1 500 000:1 poprawia widoczność detali w ciemnych obszarach, co zwiększa czytelność scen i ułatwia dostrzeganie przeciwników.</p>\n<p> </p>\n<p><h3>Pantone Validated</h3></p>\n<p>Monitor posiada certyfikat Pantone Validated, który potwierdza zgodność kolorów z biblioteką Pantone. Obejmuje ponad 2100 barw oraz ponad 110 odcieni SkinTone, co zapewnia realistyczne odwzorowanie kolorów w grach i materiałach wizualnych.</p>\n<p> </p>\n<p><h3>HDR10+ Gaming</h3></p>\n<p>HDR10+ Gaming optymalizuje jasność i kontrast w czasie rzeczywistym, poprawiając widoczność w ciemnych i jasnych obszarach. Dzięki temu sceny w grach są bardziej dynamiczne, a ukryte elementy stają się wyraźniejsze.</p>\n<p> </p>\n<p><h3>Dual Mode – 4K 165 Hz lub FHD 330 Hz</h3></p>\n<p>Monitor oferuje dwa tryby pracy:</p>\n<p>- 4K 165 Hz – wysoka szczegółowość do gier RPG, przygodowych i single‑player</p>\n<p>- FHD 330 Hz – maksymalna płynność do gier e‑sportowych, FPS i wyścigów.</p>\n<p>Przełączanie trybów odbywa się szybko, co pozwala dopasować parametry do aktualnej rozgrywki.</p>\n<p> </p>\n<p><h3>Czas reakcji 0.03 ms</h3></p>\n<p>Technologia OLED zapewnia niemal natychmiastowy czas reakcji 0.03 ms (GtG). Redukuje to smużenie i poprawia ostrość dynamicznych scen, co jest kluczowe w grach FPS i tytułach wymagających szybkiej reakcji.</p>\n<p> </p>\n<p><h3>FreeSync Premium Pro i G‑Sync Compatible</h3></p>\n<p>Monitor obsługuje FreeSync Premium Pro oraz jest kompatybilny z G‑Sync. Synchronizacja obrazu z kartą graficzną eliminuje zacięcia, opóźnienia i efekt „rozdzierania” klatek, zapewniając płynny obraz w dynamicznych grach.</p>\n<p> </p>\n<p><h3>Ergonomiczna podstawa</h3></p>\n<p>Podstawa HAS Pivot umożliwia regulację wysokości (105 mm), pochylenia, obrotu oraz pivot 90°. Dzięki temu monitor można dopasować do stanowiska i zachować wygodę podczas długich sesji.</p>\n<p> </p>\n<p><h3>Dla kogo jest Odyssey OLED G7?</h3></p>\n<p>Monitor będzie odpowiedni dla graczy oczekujących wysokiej jakości obrazu, głębokiej czerni i natychmiastowej reakcji matrycy. Sprawdzi się w grach e‑sportowych dzięki 330 Hz oraz w grach fabularnych dzięki OLED 4K. Jeśli zależy Ci na monitorze 32\" OLED z funkcją Dual Mode, HDR10+ Gaming i pełną ergonomią, wybierz Odyssey OLED G7.</p>\n<p> </p>\n<p><h3>Najczęściej zadawane pytania</h3></p>\n<p><h3>Czy monitor obsługuje 4K przy 165 Hz?</h3></p>\n<p>Tak, tryb 4K działa z częstotliwością 165 Hz.</p>\n<p><h3>Czy monitor obsługuje 330 Hz?</h3></p>\n<p>Tak, w trybie FHD monitor osiąga 330 Hz.</p>\n<p><h3>Czy monitor jest kompatybilny z G‑Sync?</h3></p>\n<p>Tak, monitor jest zgodny z G‑Sync Compatible.</p>\n<p><h3>Czy monitor posiada funkcję Dual Mode?</h3></p>\n<p>Tak, monitor umożliwia szybkie przełączanie między 4K 165 Hz a FHD 330 Hz.</p>","descriptionMarketing":null,"accessoriesRelated":[],"hasDataEraseCode":false,"predecessorProductIds":[],"predecessor":null,"successorProductIds":[],"successor":null,"assetSafetyInformationDocuments":[{"__typename":"GraphqlProductAsset","link":"https://assets.mmsrg.com/ada/166325/c1/-/-/ASSET_MMS_165172055","pixelboxxId":"ASSET_MMS_165172055","altText":"Czarno-biały dokument z instrukcjami bezpieczeństwa dla monitorów komputerowych. Tekst na białym tle."}],"assetCeConformityDeclarations":[],"manufacturerLegalContact":{"__typename":"GraphqlManufacturerLegalContact","legalName":"Samsung Electronics Polska Sp. z o.o","email":null,"euStablished":true,"responsibleContactPersonName":null,"websiteUrl":"https://www.samsung.com/pl/support/contact/","address":{"__typename":"GraphqlManufacturerLegalContactAddress","additionalDetails":null,"addressLine":"ul. Postępu 14","city":"Warszawa","country":"Polska","zipCode":"02-676"},"euResponsibleContact":{"__typename":"GraphqlManufacturerLegalEuResponsibleContact","address":{"__typename":"GraphqlManufacturerLegalContactAddress","additionalDetails":null,"addressLine":null,"city":null,"country":null,"zipCode":null},"email":nul

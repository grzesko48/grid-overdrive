ature:PROD_FEAT_14112:27"},{"__ref":"GraphqlProductFeature:PROD_FEAT_91295:Wewnętrzny"}]}]},"GraphqlProduct:Media:pl-PL:1501524":{"__typename":"GraphqlProduct","id":"1501524","locale":"pl-PL","salesLine":"Media","title":"Monitor ASUS ROG Strix XG27WCMS 27 WQHD VA 1ms 280Hz AMD FreeSync Premium HDR10 Czarny","titleImageId":"ASSET_MMS_167479186","rawTitle":"XG27WCMS","assortmentType":null,"kindOfProduct":"MONITOR","onlineReleasedAt":"2025-12-01T00:00:00.000Z","featureGroupsWithProductId":{"__ref":"GraphqlProductFeatureGroups:1501524"},"assetFeatureImages":[],"featureName":"MONITOR","breadcrumbs":[{"__typename":"GraphqlBreadcrumb","categoryId":"CAT_PL_MM_25865","name":"Komputery i Tablety"},{"__typename":"GraphqlBreadcrumb","categoryId":"CAT_PL_MM_25887","name":"Monitory"},{"__typename":"GraphqlBreadcrumb","categoryId":"CAT_PL_MM_31050","name":"Monitory dla graczy"}],"ean":"4711387530146","manufacturer":"ASUS","manufacturerId":"417","url":"/pl/product/_monitor-asus-rog-strix-xg27wcms-27-wqhd-va-1ms-280hz-amd-freesync-premium-hdr10-czarny-1501524.html","vat":{"__typename":"GraphqlVat","rate":0.23},"variants":[],"additionalInformation":null,"retailRestrictions":[],"tax":23,"productGroupId":4249,"description":"<p><h3>Monitor ASUS ROG Strix XG27WCMS 27 WQHD VA 1ms 280Hz AMD FreeSync Premium HDR10 Czarny</h3></p>\n<p>ASUS ROG Strix XG27WCMS to zakrzywiony monitor gamingowy 27″ z matrycą Fast VA i rozdzielczością WQHD (2560 × 1440). Dzięki częstotliwości odświeżania 280 Hz i czasowi reakcji 1 ms oferuje ekstremalną płynność obrazu i przewagę w dynamicznych grach. Obsługa AMD FreeSync Premium oraz certyfikat VESA DisplayHDR 400 gwarantują płynność i realistyczne odwzorowanie kolorów.</p>\n<p> </p>\n<p> </p>\n<p><h3>Najważniejsze korzyści:</h3></p>\n<p>- Rozdzielczość WQHD (2560 × 1440) – szczegółowy obraz i większa przestrzeń robocza</p>\n<p>- Częstotliwość odświeżania 280 Hz – ultraszybka płynność w grach e‑sportowych</p>\n<p>- Czas reakcji 1 ms (GTG) – brak smużenia i wyraźny obraz w ruchu</p>\n<p>- Technologia AMD FreeSync Premium i Adaptive‑Sync – płynny obraz bez zrywania klatek</p>\n<p>- Obsługa HDR10, certyfikat VESA DisplayHDR 400 – lepszy kontrast i głębia obrazu</p>\n<p>- Funkcje GamePlus, Shadow Boost i ELMB Sync – przewaga w grach dzięki lepszej widoczności.</p>\n<p> </p>\n<p><h3>Jakość obrazu i funkcje gamingowe</h3></p>\n<p>Monitor oferuje zakrzywioną matrycę 1500R, która zwiększa immersję i komfort grania. Dzięki 280 Hz i 1 ms gracze zyskują przewagę w dynamicznych grach FPS i e‑sportowych. FreeSync Premium eliminuje efekt tearingu, a HDR10 podnosi realizm obrazu.</p>\n<p> </p>\n<p><h3>Kolory i HDR</h3></p>\n<p>Pokrycie barw DCI‑P3 95% i sRGB 125% zapewnia żywe kolory i szeroką gamę tonalną. Certyfikat VESA DisplayHDR 400 gwarantuje lepszy kontrast i jasność do 400 cd/m².</p>\n<p> </p>\n<p><h3>Łączność i funkcje dodatkowe</h3></p>\n<p>Monitor wyposażono w DisplayPort 1.4, HDMI 2.1 oraz USB‑C z Power Delivery 15 W. Oprogramowanie DisplayWidget Center ułatwia konfigurację ustawień, a funkcje GameVisual i GameFast Input wspierają graczy w dopasowaniu obrazu do różnych scenariuszy.</p>\n<p> </p>\n<p><h3>Design i ergonomia</h3></p>\n<p>XG27WCMS ma smukłą konstrukcję z gamingowym wykończeniem w kolorze czarnym. Podstawa umożliwia regulację wysokości (0–120 mm), pochylenia (+20° ~ –5°), obrotu (±35°) oraz montaż w standardzie VESA 100 × 100 mm.</p>\n<p> </p>\n<p><h3>Dla kogo ASUS ROG Strix XG27WCMS?</h3></p>\n<p>Model XG27WCMS jest przeznaczony dla graczy e‑sportowych i fanów dynamicznych gier, którzy oczekują maksymalnej płynności obrazu, szybkiej reakcji i immersji dzięki zakrzywionej matrycy WQHD.</p>","descriptionMarketing":null,"accessoriesRelated":[{"__typename":"GraphqlRelatedProduct","productId":"1488849"},{"__typename":"GraphqlRelatedProduct","productId":"1502447"},{"__typename":"GraphqlRelatedProduct","productId":"1502448"},{"__typename":"GraphqlRelatedProduct","productId":"1442718"},{"__typename":"GraphqlRelatedProduc

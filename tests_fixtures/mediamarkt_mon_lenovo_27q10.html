ypename":"GraphqlBreadcrumb","categoryId":"CAT_PL_MM_25865","name":"Komputery i Tablety"},{"__typename":"GraphqlBreadcrumb","categoryId":"CAT_PL_MM_25887","name":"Monitory"},{"__typename":"GraphqlBreadcrumb","categoryId":"CAT_PL_MM_31050","name":"Monitory dla graczy"}],"ean":"0198156960689","manufacturer":"LENOVO","manufacturerId":"1190","url":"/pl/product/_monitor-lenovo-legion-27q-10-27-qhd-ips-05ms-240hz-amd-freesync-premium-nvidia-g-sync-czarny-1498879.html","vat":{"__typename":"GraphqlVat","rate":0.23},"variants":[],"additionalInformation":null,"retailRestrictions":[],"tax":23,"productGroupId":3107,"description":"<p><h3>Monitor LENOVO Legion 27Q-10 27 QHD IPS 0.5ms 240Hz AMD FreeSync Premium Nvidia G-Sync Czarny</h3></p>\n<p>Lenovo Legion 27Q-10 to monitor klasy premium zaprojektowany z myślą o najbardziej wymagających graczach. Wyposażony w 27-calową matrycę IPS o rozdzielczości QHD (2560 × 1440) oferuje niezwykle ostry obraz, bogate kolory i wyjątkową płynność dzięki odświeżaniu 240 Hz oraz czasowi reakcji 0,5 ms (MPRT). Obsługa technologii AMD FreeSync Premium i NVIDIA G-SYNC Compatible gwarantuje perfekcyjnie zsynchronizowany obraz bez zacięć i efektu tearingu.</p>\n<p> </p>\n<p> </p>\n<p><h3>Kluczowe zalety produktu:</h3></p>\n<p>- 27″ matryca QHD (2560×1440) – większa szczegółowość i przestrzeń robocza niż w FHD</p>\n<p>- IPS 240 Hz / 0,5 ms (MPRT) – błyskawiczna reakcja i ultra płynność ruchu</p>\n<p>- AMD FreeSync Premium oraz NVIDIA G-SYNC® Compatible – pełna synchronizacja obrazu niezależnie od karty graficznej</p>\n<p>- HDR10 – głębsze kontrasty i bardziej realistyczne efekty świetlne</p>\n<p>- 99% sRGB i 90% DCI-P3 – dokładne odwzorowanie barw idealne dla twórców i graczy</p>\n<p>- Eyesafe Display 2.0 i TÜV Low Blue Light – mniejsze zmęczenie wzroku podczas długich sesji</p>\n<p>- Ergonomiczna podstawa LTPS (Lift, Tilt, Pivot, Swivel) – pełna regulacja pozycji ekranu</p>\n<p>- Lenovo Artery + Legion Space – intuicyjna personalizacja ustawień monitora.</p>\n<p> </p>\n<p><h3>Perfekcja w każdym pikselu</h3></p>\n<p>Ekran QHD 240 Hz to doskonałe połączenie rozdzielczości i płynności. Legion 27Q-10 oferuje bogactwo kolorów (99% sRGB, 90% DCI-P3) oraz wysoką jasność 300 nitów, dzięki czemu każdy detal pozostaje widoczny nawet w dynamicznych scenach. Smukłe ramki i matowa powłoka tworzą czysty, nowoczesny wygląd idealny do stanowisk gamingowych.</p>\n<p> </p>\n<p><h3>Dla kogo ten monitor?</h3></p>\n<p>Dla graczy e-sportowych, streamerów i twórców, którzy oczekują najwyższej płynności, jakości obrazu i pełnej kontroli nad ergonomią.</p>","descriptionMarketing":null,"accessoriesRelated":[{"__typename":"GraphqlRelatedProduct","productId":"1488849"},{"__typename":"GraphqlRelatedProduct","productId":"1502447"},{"__typename":"GraphqlRelatedProduct","productId":"1502448"},{"__typename":"GraphqlRelatedProduct","productId":"1442718"},{"__typename":"GraphqlRelatedProduct","productId":"1483118"},{"__typename":"GraphqlRelatedProduct","productId":"1488859"},{"__typename":"GraphqlRelatedProduct","productId":"1488862"},{"__typename":"GraphqlRelatedProduct","productId":"1426609"},{"__typename":"GraphqlRelatedProduct","productId":"1427598"},{"__typename":"GraphqlRelatedProduct","productId":"1449797"},{"__typename":"GraphqlRelatedProduct","productId":"1471577"},{"__typename":"GraphqlRelatedProduct","productId":"1300375"},{"__typename":"GraphqlRelatedProduct","productId":"1491678"},{"__typename":"GraphqlRelatedProduct","productId":"1487507"},{"__typename":"GraphqlRelatedProduct","productId":"1493135"}],"hasDataEraseCode":false,"predecessorProductIds":[],"predecessor":null,"successorProductIds":[],"successor":null,"assetSafetyInformationDocuments":[{"__typename":"GraphqlProductAsset","link":"https://assets.mmsrg.com/ada/166325/c1/-/-/ASSET_MMS_165172055","pixelboxxId":"ASSET_MMS_165172055","altText":"Czarno-biały dokument z instrukcjami bezpieczeństwa dla monitorów komputerowych. Tekst na białym tle."}],"assetCeConformityDeclarations":[
